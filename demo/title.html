<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;background:#FAF9F6;color:#15171E;
       font-family:Archivo,sans-serif;display:flex;flex-direction:column;
       justify-content:center;padding:0 150px;position:relative}
  /* The shirorekha — the stroke that binds letters in a Devanagari word, and
     the structural device used throughout the app. */
  .rule{position:absolute;left:150px;right:150px;height:2px;background:#15171E}
  .rule.top{top:150px}
  .brand{display:flex;align-items:baseline;gap:18px;margin-bottom:90px}
  .brand .dev{font-family:'Tiro Devanagari Hindi',serif;font-size:44px}
  .brand .name{font-size:26px;color:#464A56;letter-spacing:-.01em}
  h1{font-family:'Tiro Devanagari Hindi',serif;font-size:104px;line-height:1.08;letter-spacing:-.015em}
  h1 .hi{color:#0B6E6E}
  p.sub{margin-top:38px;font-size:30px;line-height:1.5;color:#464A56;max-width:34ch}
  .meta{position:absolute;left:150px;right:150px;bottom:150px;
        display:flex;justify-content:space-between;align-items:flex-end;
        border-top:2px solid #15171E;padding-top:22px}
  .meta .langs{display:flex;gap:12px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.09em;
        text-transform:uppercase;border:1px solid #DCD8CF;border-radius:999px;padding:8px 18px;color:#464A56}
  .chip.on{background:#0B6E6E;border-color:#0B6E6E;color:#FAF9F6}
  .url{font-family:'JetBrains Mono',monospace;font-size:19px;color:#7C8090}
</style></head>
<body>
  <div class="rule top"></div>
  <div class="brand"><span class="dev">आरंभ</span><span class="name">Aarambh Realty</span></div>
  <h1>She calls property buyers<br>and speaks <span class="hi">हिंदी</span>.</h1>
  <p class="sub">A live AI voice agent that qualifies real-estate leads over the phone.</p>
  <div class="meta">
    <div class="langs">
      <span class="chip on">Hindi</span><span class="chip on">Hinglish</span><span class="chip on">English</span>
    </div>
    <span class="url">real-estate-ai-calling-agent.vercel.app</span>
  </div>
</body></html>
